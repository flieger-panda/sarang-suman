<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG favicons for "Add to Home Screen" and would fall back
         to a page screenshot, so this ships a raster copy. Deliberately a
         full-bleed square: iOS applies its own rounded mask, and a
         pre-rounded source would double-round into black corner wedges. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <title>sarang suman</title>
    <meta name="description" content="software dev &amp; cs student @ GT" />

    <!-- Absolute URLs: link scrapers (LinkedIn, iMessage, Slack, X) don't
         resolve relative paths, so "/og.png" here would silently yield no
         preview image at all. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sarangsuman.me/" />
    <meta property="og:title" content="sarang suman" />
    <meta property="og:description" content="software dev &amp; cs student @ GT" />
    <meta property="og:image" content="https://sarangsuman.me/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="sarang suman — terminal-style menu on black" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="sarang suman" />
    <meta name="twitter:description" content="software dev &amp; cs student @ GT" />
    <meta name="twitter:image" content="https://sarangsuman.me/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
